name: Build Inspired Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Inspired Shop
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.12 \
            python3.12-venv \
            python3.12-dev \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev

      - name: Create Python 3.12 environment
        run: |
          python3.12 -m venv .venv-build
          . .venv-build/bin/activate

          python -m pip install --upgrade \
            pip==25.3 \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==3.1.4 \

          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            p4a-source

          python --version
          python -m buildozer --version

      - name: Build APK
        run: |
          . .venv-build/bin/activate

          buildozer -v android debug p4a.source_dir=$GITHUB_WORKSPACE/p4a-source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspired-shop-debug-apk
          path: bin/*.apk
          if-no-files-found: error
