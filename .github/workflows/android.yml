name: Build Inspired Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull official Buildozer image
        run: |
          docker pull kivy/buildozer:latest

      - name: Build APK
        run: |
          mkdir -p "$HOME/.buildozer"

          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$GITHUB_WORKSPACE":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspired-shop-debug-apk
          path: bin/*.apk
          if-no-files-found: error
