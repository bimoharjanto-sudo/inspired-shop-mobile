name: Build Inspired Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Inspired Shop
        uses: actions/checkout@v4

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.12 \
            python3.12-venv \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev

      - name: Create Python 3.12 environment
        run: |
          python3.12 -m venv .venv-build
          . .venv-build/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython
          python -m buildozer --version
          python -m pip show buildozer cython

      - name: Build APK
        run: |
          . .venv-build/bin/activate
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspired-shop-debug-apk
          path: bin/*.apk
          if-no-files-found: error
